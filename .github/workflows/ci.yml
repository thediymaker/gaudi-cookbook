name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.11.7 yamllint==1.37.1
      - run: ruff check .
      - run: ruff format --check .
      - run: yamllint -c .yamllint.yaml recipes kubernetes .github
      - run: python3 scripts/gen_llms_txt.py --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - run: python3 catalog/build.py --check --no-fetch --out _site
