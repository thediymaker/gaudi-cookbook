# Gaudi overlay recipe. Format: recipes/README.md. Page: docs/recipes/qwen3-coder-next-fp8.md
meta:
  title: "Qwen3-Coder-Next-FP8"
  slug: "qwen3-coder-next-fp8"
  provider: "Qwen"
  description: "80B hybrid MoE (Gated DeltaNet + attention, 3B active) coding model with tool calling, Qwen's FP8 release, 256K context on two Gaudi 2 cards."
  date_added: 2026-11-26
  date_updated: 2026-11-26
  tasks:
    - text
  related_recipes:
    - "Qwen/Qwen3-Coder-Next"
    - "Qwen/Qwen3-Coder-30B-A3B-Instruct"
  hardware:
    gaudi2: verified

model:
  model_id: "Qwen/Qwen3-Coder-Next-FP8"
  architecture: moe
  parameter_count: "80B"
  active_parameters: "3B"
  context_length: 262144

features:
  tool_calling:
    description: "Automatic tool choice with the qwen3_coder parser."
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder"]

opt_in_features: []

variants:
  default:
    precision: fp8
    vram_minimum_gb: 97
    description: "Qwen's block FP8 checkpoint (128 x 128 blocks, dynamic activations, 80.4 GB), two Gaudi 2 cards."

gaudi:
  hardware: gaudi2
  cards: { total: 2, tp: 2, ep: false }
  image:
    vllm_gaudi: "v0.26.0"
    vllm_gaudi_commit: "b059f9c"
    vllm_commit: "568afb3a"
    gaudi_sw: "1.24.1"
    placeholder: "<your-vllm-gaudi-v0.26.0-image>"
  max_model_len: 262144
  serve_args:
    - "--tensor-parallel-size"
    - "2"
    - "--max-model-len"
    - "262144"
    - "--max-num-seqs"
    - "8"
    - "--gpu-memory-utilization"
    - "0.85"
    - "--block-size"
    - "128"
    - "--max-num-batched-tokens"
    - "4096"                                  # a prefill chunk runs twice as long on two cards as on four
    - "--enable-chunked-prefill"
    - "--enable-prefix-caching"               # correct on GDN layers with gdn-prefix-cache
    - "--enable-prompt-tokens-details"
    - "--enable-auto-tool-choice"
    - "--tool-call-parser"
    - "qwen3_coder"
  env:
    PT_HPU_LAZY_MODE: "0"                     # compile mode: lazy mode fails at the first GDN decode
    PT_HPU_ENABLE_LAZY_COLLECTIVES: "true"
    VLLM_USE_NAIVE_MAMBA_CACHE_SHARING: "1"
    VLLM_COMPACT_GDN: "1"                     # compact GDN state slots; gdn-prefix-cache keeps checkpoints in the KV pages
    VLLM_HPU_MOE_GATHER: "1"                  # gathered-expert FP8 MoE (fix fp8-moe-gather): decode reads only the routed experts
    VLLM_SKIP_WARMUP: "true"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"  # the 300 s default can be overrun by first-use graph compiles
  buckets: null
  required_fixes:
    - prompt-order            # a same-step prefix-cache hit read a block before its writer computed it
    - sampling-rows-refresh   # device sampling rows stale after batch reorders
    - structured-output-rows  # structured-output steps sample rows with the wrong params
    - bad-words-index         # bad_words IndexError kills the EngineCore
    - logitsprocs-rows        # logit_bias, min_p, min_tokens silently ignored
    - async-discard-counter   # AttributeError on the first preemption under async scheduling
    - resumed-prefill-logits  # a request resumed after preemption with prefix-cache hits re-sampled its tail
    - hybrid-decode-pad       # decode padding can land inside a live KV block when the hybrid KV block is split into kernel blocks
    - gdn-prefix-cache        # prefix-cache hits on GDN layers resumed from a wrong state
    - gather-logprobs-int32   # recommended on every image; the corruption itself is lazy-mode only
    - prompt-logprobs         # row-chunks the prompt logits: a 4096-token chunk would otherwise build about 2.5 GB of fp32 logits at once
    - logprobs-decode-guard   # a bad logprob id no longer kills the API server
    - fp8-moe-gather          # backport of the gathered-expert FP8 MoE: decode reads only the routed experts
    - rope-cpu-cache          # RoPE tables built on the HPU are wrong from position about 196K
    - rank-exception-fatal    # an exception on a non-zero TP rank stops the engine instead of serving garbage
  verified:
    - "Known-answer prompts 11/12 at temperature 0 (string reversal answered idaug); tool calls 6/6 streamed and not"
    - "top_logprobs 20 soak 200/200 clean; prompt_logprobs over 9,146 positions; JSON schema and logit_bias take effect"
    - >-
      Prefix-cache hit vs cold, 4 greedy prompts of 6K to 118K tokens: identical text and bit-identical logprobs 4/4; cached tokens a multiple of 640
      on every hit
    - "Needles, 3 depths each, cold: 3/3 at 65K, 131K and 244K tokens"
    - "Decode per stream 50.9 / 43.0 / 29.6 tok/s at 1 / 4 / 8 streams, 182 tok/s aggregate at 8 (256 tokens, warm)"
  notes:
    - >-
      Prefix caching needs gdn-prefix-cache: on the stock release, prefix-cache hits on Gated DeltaNet layers resume from the wrong state. At TP 2
      the hybrid KV block is 640 tokens.
    - "VLLM_HPU_MOE_GATHER=1 with fp8-moe-gather: decode steps read only the routed experts (up to 8 sequences at the default ratio 0.4)."
    - "Compile mode compiles each new shape on first use, minutes per shape on a fresh node; keep the recipe cache on the node and warm new servers."
