# Gaudi overlay recipe. Format: recipes/README.md. Page: docs/recipes/qwen3-6-35b-a3b-fp8.md
meta:
  title: "Qwen3.6-35B-A3B-FP8"
  slug: "qwen3-6-35b-a3b-fp8"
  provider: "Qwen"
  description: "35B MoE (3B active) hybrid (Gated DeltaNet + attention) reasoning model with vision, FP8, native 256K context on one Gaudi 2 card."
  date_added: 2026-10-23
  date_updated: 2026-10-24
  tasks:
    - multimodal
  related_recipes:
    - "Qwen/Qwen3.6-27B-FP8"
  hardware:
    gaudi2: verified

model:
  model_id: "Qwen/Qwen3.6-35B-A3B-FP8"
  architecture: moe
  parameter_count: "35B"
  active_parameters: "3B"
  context_length: 262144

features:
  tool_calling:
    description: "Automatic tool choice with the qwen3_coder parser."
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder"]
  reasoning:
    description: "Split <think> reasoning from the answer. Thinking is on by default; chat_template_kwargs enable_thinking false turns it off."
    args: ["--reasoning-parser", "qwen3"]

opt_in_features: []

variants:
  default:
    precision: fp8
    vram_minimum_gb: 57
    description: "The official FP8 checkpoint (block 128 x 128, dynamic activations), one Gaudi 2 card."

gaudi:
  hardware: gaudi2
  cards: { total: 1, tp: 1, ep: false }
  image:
    vllm_gaudi: "v0.26.0"
    vllm_gaudi_commit: "b059f9c"
    vllm_commit: "568afb3a"
    gaudi_sw: "1.24.1"
    placeholder: "<your-vllm-gaudi-v0.26.0-image>"
  max_model_len: 262144
  serve_args:
    - "--tensor-parallel-size"
    - "1"
    - "--max-model-len"
    - "262144"
    - "--max-num-seqs"
    - "8"
    - "--gpu-memory-utilization"
    - "0.75"
    - "--block-size"
    - "128"
    - "--max-num-batched-tokens"
    - "1280"
    - "--enable-chunked-prefill"
    - "--enable-prefix-caching"               # correct on GDN layers with gdn-prefix-cache
    - "--enable-prompt-tokens-details"
    - "--reasoning-parser"
    - "qwen3"
    - "--enable-auto-tool-choice"
    - "--tool-call-parser"
    - "qwen3_coder"
    - "--limit-mm-per-prompt"
    - '{"image":16,"video":0}'
  env:
    PT_HPU_LAZY_MODE: "0"                     # compile mode: lazy mode loses the GDN state cache at first decode
    PT_HPU_ENABLE_LAZY_COLLECTIVES: "true"
    VLLM_HPU_MOE_GATHER: "1"                  # gathered-expert FP8 MoE (fix fp8-moe-gather)
    VLLM_HPU_MOE_GATHER_RATIO: "0.25"         # gather while tokens x top_k (8) <= 256 experts x 0.25 = 64: up to 8 decode tokens
    VLLM_HPU_MOE_GATHER_VERIFY: "0"
    VLLM_USE_NAIVE_MAMBA_CACHE_SHARING: "1"
    VLLM_COMPACT_GDN: "1"                     # compact GDN state slots; gdn-prefix-cache keeps checkpoints in the KV pages
    VLLM_QWEN3_STRICT_THINK_END: "1"          # read by qwen3-strict-think-end: only </think> ends reasoning
    PT_HPUGRAPH_DISABLE_TENSOR_CACHE: "false"
    VLLM_SKIP_WARMUP: "true"
    VLLM_GRAPH_RESERVED_MEM: "0.3"
    VLLM_EXPONENTIAL_BUCKETING: "True"
    VLLM_PROMPT_BS_BUCKET_MIN: "1"
    VLLM_PROMPT_BS_BUCKET_STEP: "1"
    VLLM_PROMPT_BS_BUCKET_MAX: "8"
    VLLM_DECODE_BS_BUCKET_MIN: "1"
    VLLM_DECODE_BS_BUCKET_STEP: "1"
    VLLM_DECODE_BS_BUCKET_MAX: "8"
    VLLM_PROMPT_SEQ_BUCKET_MIN: "128"
    VLLM_PROMPT_SEQ_BUCKET_STEP: "4096"
    VLLM_PROMPT_SEQ_BUCKET_MAX: "262144"
    VLLM_DECODE_BLOCK_BUCKET_MIN: "128"
    VLLM_DECODE_BLOCK_BUCKET_STEP: "1024"
    VLLM_DECODE_BLOCK_BUCKET_MAX: "16384"
    VLLM_ENGINE_ITERATION_TIMEOUT_S: "3600"
    VLLM_RPC_TIMEOUT: "3600000"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  buckets: null
  required_fixes:
    - prompt-order            # a same-step prefix-cache hit read a block before its writer computed it
    - sampling-rows-refresh   # device sampling rows stale after batch reorders
    - structured-output-rows  # structured-output steps sample rows with the wrong params
    - bad-words-index         # bad_words IndexError kills the EngineCore
    - logitsprocs-rows        # logit_bias, min_p, min_tokens silently ignored
    - async-discard-counter   # AttributeError on the first preemption under async scheduling
    - resumed-prefill-logits  # a request resumed after preemption with prefix-cache hits re-sampled its tail
    - hybrid-decode-pad       # decode padding can land inside a live KV block when the hybrid KV block is split into kernel blocks
    - gdn-prefix-cache        # prefix-cache hits on GDN layers resumed from a wrong state
    - gather-logprobs-int32   # recommended on every image; the corruption itself is lazy-mode only
    - prompt-logprobs         # prompt_logprobs request kills the engine (flat hidden states)
    - logprobs-decode-guard   # a bad logprob id no longer kills the API server
    - fp8-moe-gather          # gathered-expert FP8 MoE combine (vllm-gaudi PR #1731, in v0.30)
    - rope-cpu-cache          # RoPE tables built on the HPU are wrong from position about 196K
    - qwen3-strict-think-end  # a <tool_call> drafted while thinking was returned as a real call
  verified:
    - "Greedy parity, 32 prompts of 5K to 31K tokens, cache hit vs cold: 32/32 identical with bit-identical logprobs; cold vs cold 32/32"
    - "Cross-request isolation, 24 rounds: 0 leaks; images served from the cache, 8 cases: hit equals cold 8/8"
    - "Needles at 65K, 130K and 250K, three depths: 9/9 cold, 9/9 from the cache, hit equals cold 9/9"
    - "16 images per prompt: 16/16 colours named in order (thinking off), a 17th rejected with a clean 400"
    - >-
      Requests sharing a prefix in the same step, 24: 24/24 correct; 11/24 worded differently from sequential runs, including 2 requests that had no
      cache hit. With prefix caching off the same test words 16/24 differently: batch composition on this MoE, not the cache
    - "Forced tool calls (tool_choice required): whitespace runaway 0/32"
    - "Tool reliability, 3 cases x 40 sampled: 120/120 with strict think-end"
    - "prompt_logprobs: aligned, in vocabulary and consistent with decode logprobs (plp check PASS)"
    - >-
      Agent replay, 4 sessions 8K to 64K: wall 130.5 s vs 607.5 s with caching off, later-turn TTFT p50 3.7 vs 18.3 s, 78% of prompt tokens
      served from the cache; 0 preemptions
    - "Functional set (arithmetic, factual, code, multi-turn, streaming, tool calls): 10/10 (earlier run, prefix caching off)"
    - "Decode 74.5 tokens/s single stream, 204.8 tokens/s per card at 8 in flight, with fp8-moe-gather (earlier run, prefix caching off)"
    - "Gathered-expert MoE vs the stock op: no element beyond 2 FP8 ULPs"
  notes:
    - >-
      Prefix caching needs gdn-prefix-cache: on the stock release, prefix-cache hits on Gated DeltaNet layers resume from the wrong state. The fix
      stores GDN state checkpoints in the KV pages of the cache and keeps the compact GDN slots (VLLM_COMPACT_GDN=1).
    - >-
      With prefix caching on, the hybrid KV block is 1,152 tokens and prefill chunks end on block boundaries, so a 1,280-token batch carries one block
      of prompt. Prompts shorter than one block never hit.
    - >-
      --max-num-seqs and VLLM_HPU_MOE_GATHER_RATIO move together: 9+ decode tokens fall back to the stock MoE op at about 19 tok/s per stream (16
      sequences would need a ratio of 0.5, not measured).
    - >-
      Loading under a CPU quota can take 78 minutes: vllm-gaudi sizes its load thread pool from the host's core count, and the per-tensor FP8 rescale
      is then CPU-throttled. Run without a CPU limit, or cap the pool at the quota.
