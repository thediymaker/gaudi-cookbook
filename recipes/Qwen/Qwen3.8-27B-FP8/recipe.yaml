# Gaudi overlay recipe. Format: recipes/README.md. Page: docs/recipes/qwen3-8-27b-fp8.md
meta:
  title: "Qwen3.8-27B-FP8"
  slug: "qwen3-8-27b-fp8"
  provider: "Qwen"
  description: "27B dense hybrid (Gated DeltaNet + attention) reasoning model with vision, Qwen's block FP8 release, native 256K context on one Gaudi 2 card, 32 sequences."
  date_added: 2026-11-26
  date_updated: 2026-11-26
  tasks:
    - multimodal
  related_recipes:
    - "Qwen/Qwen3.8-27B"
    - "Qwen/Qwen3.6-27B-FP8"
  hardware:
    gaudi2: verified

model:
  model_id: "Qwen/Qwen3.8-27B-FP8"
  architecture: dense
  parameter_count: "27B"
  active_parameters: "27B"
  context_length: 262144

features:
  tool_calling:
    description: "Automatic tool choice with the qwen3_coder parser."
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder"]
  reasoning:
    description: "Split <think> reasoning from the answer. Reasoning effort (xhigh, medium, low) goes in chat_template_kwargs; medium by default."
    args: ["--reasoning-parser", "qwen3", "--default-chat-template-kwargs", '{"reasoning_effort": "medium"}']

opt_in_features: []

variants:
  default:
    precision: fp8
    vram_minimum_gb: 38
    description: "Qwen's block FP8 checkpoint (128 x 128 blocks, dynamic activations, 30.9 GB), one Gaudi 2 card."

gaudi:
  hardware: gaudi2
  cards: { total: 1, tp: 1, ep: false }
  image:
    vllm_gaudi: "v0.26.0"
    vllm_gaudi_commit: "b059f9c"
    vllm_commit: "568afb3a"
    gaudi_sw: "1.24.1"
    placeholder: "<your-vllm-gaudi-v0.26.0-image>"
  max_model_len: 262144
  serve_args:
    - "--tensor-parallel-size"
    - "1"
    - "--max-model-len"
    - "262144"
    - "--max-num-seqs"
    - "32"
    - "--gpu-memory-utilization"
    - "0.85"
    - "--block-size"
    - "128"
    - "--max-num-batched-tokens"
    - "1792"
    - "--enable-chunked-prefill"
    - "--enable-prefix-caching"               # correct on GDN layers with gdn-prefix-cache
    - "--enable-prompt-tokens-details"
    - "--reasoning-parser"
    - "qwen3"
    - "--default-chat-template-kwargs"
    - '{"reasoning_effort": "medium"}'        # the template default (xhigh) can reason past max_tokens and return empty content
    - "--enable-auto-tool-choice"
    - "--tool-call-parser"
    - "qwen3_coder"
    - "--limit-mm-per-prompt"
    - '{"image":16,"video":0}'
  env:
    PT_HPU_LAZY_MODE: "0"                     # compile mode: lazy mode loses the GDN state cache at first decode
    PT_HPU_ENABLE_LAZY_COLLECTIVES: "true"
    VLLM_USE_NAIVE_MAMBA_CACHE_SHARING: "1"
    VLLM_COMPACT_GDN: "1"                     # compact GDN state slots; gdn-prefix-cache keeps checkpoints in the KV pages
    PT_HPUGRAPH_DISABLE_TENSOR_CACHE: "false"
    VLLM_SKIP_WARMUP: "true"
    VLLM_GRAPH_RESERVED_MEM: "0.3"
    VLLM_EXPONENTIAL_BUCKETING: "True"
    VLLM_PROMPT_BS_BUCKET_MIN: "1"
    VLLM_PROMPT_BS_BUCKET_STEP: "1"
    VLLM_PROMPT_BS_BUCKET_MAX: "8"
    VLLM_DECODE_BS_BUCKET_MIN: "1"
    VLLM_DECODE_BS_BUCKET_STEP: "1"
    VLLM_DECODE_BS_BUCKET_MAX: "32"
    VLLM_PROMPT_SEQ_BUCKET_MIN: "128"
    VLLM_PROMPT_SEQ_BUCKET_STEP: "4096"
    VLLM_PROMPT_SEQ_BUCKET_MAX: "262144"
    VLLM_DECODE_BLOCK_BUCKET_MIN: "128"
    VLLM_DECODE_BLOCK_BUCKET_STEP: "1024"
    VLLM_DECODE_BLOCK_BUCKET_MAX: "16384"
    VLLM_ENGINE_ITERATION_TIMEOUT_S: "3600"
    VLLM_RPC_TIMEOUT: "3600000"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  buckets: null
  required_fixes:
    - prompt-order            # a same-step prefix-cache hit read a block before its writer computed it
    - sampling-rows-refresh   # device sampling rows stale after batch reorders
    - structured-output-rows  # structured-output steps sample rows with the wrong params
    - bad-words-index         # bad_words IndexError kills the EngineCore
    - logitsprocs-rows        # logit_bias, min_p, min_tokens silently ignored
    - async-discard-counter   # AttributeError on the first preemption under async scheduling
    - resumed-prefill-logits  # a request resumed after preemption with prefix-cache hits re-sampled its tail
    - hybrid-decode-pad       # decode padding can land inside a live KV block when the hybrid KV block is split into kernel blocks
    - gdn-prefix-cache        # prefix-cache hits on GDN layers resumed from a wrong state
    - gather-logprobs-int32   # recommended on every image; the corruption itself is lazy-mode only
    - prompt-logprobs         # prompt_logprobs request kills the engine (flat hidden states)
    - logprobs-decode-guard   # a bad logprob id no longer kills the API server
    - rope-cpu-cache          # RoPE tables built on the HPU are wrong from position about 196K
  verified:
    - "Known-answer prompts 11/12 at temperature 0 (string reversal answered iduaG); tool calls 6/6 streamed and not"
    - "top_logprobs 20 soak 200/200 clean; JSON schema and logit_bias take effect"
    - "Teacher-forced top-1 agreement with BF16 97.29% over 9,531 positions of code, NLL 0.9508 vs 0.9481 (same pod)"
    - "Vision: 16 images in one prompt, 16/16 colours named in order"
    - >-
      Prefix-cache hit vs cold, 4 greedy prompts of 6K to 118K tokens: identical text and bit-identical logprobs 4/4; cached tokens a multiple of 896
      on every hit
    - "Needles, 3 depths each, cold: 3/3 at 65K, 131K and 244K tokens; 4 concurrent 128K needles 4/4, 0 preemptions"
    - "Decode per stream 46.0 / 35.1 / 30.0 / 22.8 / 17.9 tok/s at 1 / 4 / 8 / 16 / 32 streams, 472 tok/s aggregate at 32 (256 tokens)"
  notes:
    - >-
      Prefix caching needs gdn-prefix-cache: on the stock release, prefix-cache hits on Gated DeltaNet layers resume from the wrong state. The fix
      stores GDN state checkpoints in the KV pages (896-token blocks here) and keeps the compact GDN slots (VLLM_COMPACT_GDN=1).
    - "Only xhigh, medium and low are legal reasoning_effort values for this template; high returns HTTP 400. The top-level reasoning_effort field is ignored."
