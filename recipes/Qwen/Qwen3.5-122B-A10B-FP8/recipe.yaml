# Gaudi overlay recipe. Format: recipes/README.md. Page: docs/recipes/qwen3-5-122b-a10b-fp8.md
meta:
  title: "Qwen3.5-122B-A10B-FP8"
  slug: "qwen3-5-122b-a10b-fp8"
  provider: "Qwen"
  description: "122B hybrid MoE (Gated DeltaNet + attention, 10B active) reasoning model, FP8, native 256K context on four Gaudi 2 cards."
  date_added: 2026-10-24
  date_updated: 2026-10-24
  tasks:
    - text
  related_recipes:
    - "Qwen/Qwen3.5-397B-A17B-FP8"
    - "Qwen/Qwen3.6-35B-A3B-FP8"
  hardware:
    gaudi2: verified

model:
  model_id: "Qwen/Qwen3.5-122B-A10B-FP8"
  architecture: moe
  parameter_count: "122B"
  active_parameters: "10B"
  context_length: 262144

features:
  tool_calling:
    description: "Automatic tool choice with the qwen3_coder parser."
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder"]
  reasoning:
    description: "Split <think> reasoning from the answer. Thinking is on by default; chat_template_kwargs enable_thinking false turns it off."
    args: ["--reasoning-parser", "qwen3"]

opt_in_features: []

variants:
  default:
    precision: fp8
    vram_minimum_gb: 153
    description: "The official FP8 checkpoint (block 128 x 128, dynamic activations, 127 GB), four Gaudi 2 cards."

gaudi:
  hardware: gaudi2
  cards: { total: 4, tp: 4, ep: true }
  image:
    vllm_gaudi: "v0.26.0"
    vllm_gaudi_commit: "b059f9c"
    vllm_commit: "568afb3a"
    gaudi_sw: "1.24.1"
    placeholder: "<your-vllm-gaudi-v0.26.0-image>"
  max_model_len: 262144
  serve_args:
    - "--tensor-parallel-size"
    - "4"
    - "--enable-expert-parallel"              # 64 of the 256 experts per card
    - "--max-model-len"
    - "262144"
    - "--max-num-seqs"
    - "16"
    - "--gpu-memory-utilization"
    - "0.75"
    - "--block-size"
    - "128"
    - "--max-num-batched-tokens"
    - "4096"
    - "--enable-chunked-prefill"
    - "--enable-prefix-caching"               # correct on GDN layers with gdn-prefix-cache
    - "--enable-prompt-tokens-details"
    - "--reasoning-parser"
    - "qwen3"
    - "--enable-auto-tool-choice"
    - "--tool-call-parser"
    - "qwen3_coder"
    - "--language-model-only"                 # text only: skips the vision tower and its profiling
  env:
    PT_HPU_LAZY_MODE: "0"                     # compile mode: lazy mode loses the GDN state cache at first decode
    PT_HPU_ENABLE_LAZY_COLLECTIVES: "true"
    VLLM_HPU_MOE_GATHER: "1"                  # gathered-expert FP8 MoE (fix fp8-moe-gather)
    VLLM_HPU_MOE_GATHER_RATIO: "1.0"          # gather while tokens x top_k (8) <= 64 local experts: up to 8 decode tokens
    VLLM_HPU_MOE_GATHER_VERIFY: "0"
    VLLM_USE_NAIVE_MAMBA_CACHE_SHARING: "1"
    VLLM_COMPACT_GDN: "1"                     # compact GDN state slots; gdn-prefix-cache keeps checkpoints in the KV pages
    PT_HPUGRAPH_DISABLE_TENSOR_CACHE: "false"
    VLLM_SKIP_WARMUP: "true"
    VLLM_GRAPH_RESERVED_MEM: "0.3"
    VLLM_EXPONENTIAL_BUCKETING: "True"
    VLLM_PROMPT_BS_BUCKET_MIN: "1"
    VLLM_PROMPT_BS_BUCKET_STEP: "1"
    VLLM_PROMPT_BS_BUCKET_MAX: "16"
    VLLM_DECODE_BS_BUCKET_MIN: "1"
    VLLM_DECODE_BS_BUCKET_STEP: "1"
    VLLM_DECODE_BS_BUCKET_MAX: "16"
    VLLM_PROMPT_SEQ_BUCKET_MIN: "128"
    VLLM_PROMPT_SEQ_BUCKET_STEP: "4096"
    VLLM_PROMPT_SEQ_BUCKET_MAX: "262144"
    VLLM_DECODE_BLOCK_BUCKET_MIN: "128"
    VLLM_DECODE_BLOCK_BUCKET_STEP: "1024"
    VLLM_DECODE_BLOCK_BUCKET_MAX: "16384"
    VLLM_ENGINE_ITERATION_TIMEOUT_S: "7200"
    VLLM_RPC_TIMEOUT: "7200000"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  buckets: null
  required_fixes:
    - prompt-order            # a same-step prefix-cache hit read a block before its writer computed it
    - sampling-rows-refresh   # device sampling rows stale after batch reorders
    - structured-output-rows  # structured-output steps sample rows with the wrong params
    - bad-words-index         # bad_words IndexError kills the EngineCore
    - logitsprocs-rows        # logit_bias, min_p, min_tokens silently ignored
    - async-discard-counter   # AttributeError on the first preemption under async scheduling
    - resumed-prefill-logits  # a request resumed after preemption with prefix-cache hits re-sampled its tail
    - hybrid-decode-pad       # decode padding can land inside a live KV block when the hybrid KV block is split into kernel blocks
    - gdn-prefix-cache        # prefix-cache hits on GDN layers resumed from a wrong state
    - gather-logprobs-int32   # recommended on every image; the corruption itself is lazy-mode only
    - prompt-logprobs         # prompt_logprobs request kills the engine (flat hidden states)
    - logprobs-decode-guard   # a bad logprob id no longer kills the API server
    - fp8-moe-gather          # gathered-expert FP8 MoE combine (vllm-gaudi PR #1731, in v0.30)
    - rope-cpu-cache          # RoPE tables built on the HPU are wrong from position about 196K
    - rank-exception-fatal    # an exception on a non-zero TP rank stops the engine instead of serving garbage
  verified:
    - "Known-answer prompts 8/8 at temperature 0 and 16/16 with 16 in flight"
    - "Tool calls: 5/5 valid calls sampled at 0.6, streamed call assembled, tool result used in the answer"
    - "top_logprobs 20, prompt_logprobs, JSON schema and logit_bias all take effect; server healthy after each"
    - >-
      Prefix-cache hit vs cold, 8 greedy prompts of 6K to 126K tokens: identical text and bit-identical logprobs 8/8; cached tokens a multiple of 1,152 on
      every hit
    - "Needles, 3 depths each, cold: 3/3 at 65K, 131K and 244K tokens"
    - "Single stream 43.8 tokens/s, 16 streams 315.6 tokens/s aggregate (256 tokens, end to end)"
  notes:
    - >-
      Prefix caching needs gdn-prefix-cache: on the stock release, prefix-cache hits on Gated DeltaNet layers resume from the wrong state. The fix
      stores GDN state checkpoints in the KV pages (1152-token blocks here) and keeps the compact GDN slots (VLLM_COMPACT_GDN=1).
    - >-
      VLLM_HPU_MOE_GATHER_RATIO is per card: with expert parallelism each card holds 64 experts, so 1.0 keeps the gather path up to 8 decode
      tokens. Above that the stock MoE op runs.
    - >-
      Loading under a CPU quota is slow: vllm-gaudi sizes its load thread pool from the host's core count, and the per-tensor FP8 rescale is then
      CPU-throttled. Run without a CPU limit, or cap the pool at the quota.
