# Gaudi overlay recipe. Format: recipes/README.md. Page: docs/recipes/devstral-2-123b-instruct-2512.md
meta:
  title: "Devstral-2-123B-Instruct-2512"
  slug: "devstral-2-123b-instruct-2512"
  provider: "Mistral AI"
  description: "123B dense agentic coding model, official FP8 checkpoint, 128K context with tool calling on four Gaudi 2 cards."
  date_added: 2026-10-24
  date_updated: 2026-10-24
  tasks:
    - text
  related_recipes: []
  hardware:
    gaudi2: verified

model:
  model_id: "mistralai/Devstral-2-123B-Instruct-2512"
  architecture: dense
  parameter_count: "123B"
  active_parameters: "123B"
  context_length: 262144

features:
  tool_calling:
    description: "Automatic tool choice with the mistral tool-call parser."
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "mistral"]

opt_in_features: []

variants:
  default:
    precision: fp8
    vram_minimum_gb: 154
    description: "The official FP8 checkpoint (128 GB), four Gaudi 2 cards."

gaudi:
  hardware: gaudi2
  cards: { total: 4, tp: 4, ep: false }
  image:
    vllm_gaudi: "v0.26.0"
    vllm_gaudi_commit: "b059f9c"
    vllm_commit: "568afb3a"
    gaudi_sw: "1.24.1"
    placeholder: "<your-vllm-gaudi-v0.26.0-image>"
  max_model_len: 131072
  serve_args:
    - "--tensor-parallel-size"
    - "4"
    - "--max-model-len"
    - "131072"
    - "--max-num-seqs"
    - "4"
    - "--gpu-memory-utilization"
    - "0.92"
    - "--block-size"
    - "128"
    - "--max-num-batched-tokens"
    - "4096"
    - "--enable-chunked-prefill"
    - "--enable-prefix-caching"
    - "--enable-prompt-tokens-details"
    - "--enable-auto-tool-choice"
    - "--tool-call-parser"
    - "mistral"
    - "--trust-remote-code"
  env:
    PT_HPU_LAZY_MODE: "1"
    PT_HPU_ENABLE_LAZY_COLLECTIVES: "true"
    VLLM_SKIP_WARMUP: "true"                  # graphs compile on first use; see the timeouts below
    VLLM_GRAPH_RESERVED_MEM: "0.40"
    VLLM_GRAPH_PROMPT_RATIO: "0.30"
    VLLM_GRAPH_PROMPT_STRATEGY: "max_bs"
    VLLM_GRAPH_DECODE_STRATEGY: "max_bs"
    VLLM_EXPONENTIAL_BUCKETING: "False"       # linear buckets: exponential context buckets pad long cold prefills up to 2x
    VLLM_PROMPT_CTX_BUCKET_MIN: "0"           # prompt context in 32-block steps (32 x 128 = one 4096-token chunk)
    VLLM_PROMPT_CTX_BUCKET_STEP: "32"
    VLLM_PROMPT_CTX_BUCKET_MAX: "992"
    VLLM_PROMPT_BS_BUCKET_MIN: "1"            # batch buckets 1..4, matching --max-num-seqs 4
    VLLM_PROMPT_BS_BUCKET_STEP: "1"
    VLLM_PROMPT_BS_BUCKET_MAX: "4"
    VLLM_DECODE_BS_BUCKET_MIN: "1"
    VLLM_DECODE_BS_BUCKET_STEP: "1"
    VLLM_DECODE_BS_BUCKET_MAX: "4"
    VLLM_PROMPT_SEQ_BUCKET_MIN: "128"         # prompt chunks are at most --max-num-batched-tokens
    VLLM_PROMPT_SEQ_BUCKET_STEP: "2048"
    VLLM_PROMPT_SEQ_BUCKET_MAX: "4096"
    VLLM_DECODE_BLOCK_BUCKET_MIN: "128"
    VLLM_DECODE_BLOCK_BUCKET_STEP: "1024"
    VLLM_DECODE_BLOCK_BUCKET_MAX: "4096"
    VLLM_ENGINE_ITERATION_TIMEOUT_S: "3600"   # first long prompt on a fresh node compiles its buckets
    VLLM_RPC_TIMEOUT: "3600000"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  buckets: null
  required_fixes:
    - prompt-order            # prefix-cache read-before-write across requests
    - sampling-rows-refresh   # device sampling rows stale after batch reorders
    - structured-output-rows  # the mistral parser gives every chat request a grammar, so every mixed step is exposed
    - bad-words-index         # bad_words IndexError kills the EngineCore
    - logitsprocs-rows        # logit_bias, min_p, min_tokens silently ignored
    - async-discard-counter   # AttributeError on the first preemption under async scheduling
    - resumed-prefill-logits  # a request resumed after preemption with prefix-cache hits re-samples its generated tail
    - gather-logprobs-int32   # top_logprobs ids corrupted in lazy mode
    - prompt-logprobs         # prompt_logprobs request kills the engine (flat hidden states)
    - logprobs-decode-guard   # a bad logprob id no longer kills the API server
    - seeded-sampling         # requests with seed can segfault a TP worker in lazy mode
    - rank-exception-fatal    # an exception on a non-zero TP rank stops the engine instead of serving garbage
  verified:
    - "Known-answer prompts 8/8 at temperature 0 and 4/4 with 4 in flight"
    - "Tool calls: 5/5 valid calls sampled at 0.6, streamed call assembled, tool result used in the answer"
    - "top_logprobs 20, prompt_logprobs, JSON schema and logit_bias all take effect; server healthy after each"
    - "Needles, 3 depths each, cold: 3/3 at 32K and 3/3 at 120K tokens"
    - "Single stream 22.1 tokens/s, 4 streams 85.7 tokens/s aggregate (256 tokens, end to end)"
  notes:
    - >-
      Chunked prefill does not interleave a short request with a long prefill: the 4096-token budget goes to the long prompt's chunk every step,
      so a short request waits for it.
    - "Licence: Modified MIT with a revenue limit (companies above USD 20 million monthly revenue need a commercial licence from Mistral AI)."
