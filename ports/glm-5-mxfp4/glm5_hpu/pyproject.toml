[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glm5-hpu"
version = "1.0.0"
description = "GLM-5.2 and GLM-5.3 in MXFP4 on Intel Gaudi 2 for vllm-gaudi v0.30.0"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

[tool.setuptools]
packages = ["glm5_hpu"]
