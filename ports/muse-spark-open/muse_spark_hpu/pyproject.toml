[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-spark-hpu"
version = "1.0.0"
description = "Muse Spark Open (AMD Quark MXFP4) on Intel Gaudi 2 for vllm-gaudi v0.30.0"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
muse_spark_hpu = "muse_spark_hpu:register"

[tool.setuptools.packages.find]
include = ["muse_spark_hpu*"]
