[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ripple-hpu"
version = "1.0.0"
description = "Ricursive Ripple-65B-Preview on Intel Gaudi 2 for vllm-gaudi v0.30.0"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
ripple_hpu = "ripple_hpu:register"

[tool.setuptools.packages.find]
include = ["ripple_hpu*"]
