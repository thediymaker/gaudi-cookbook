# HorizontalPodAutoscaler for a vLLM Deployment, on a per-pod vLLM metric.
#
# Needs a custom metrics API (for example prometheus-adapter) that serves the vLLM gauge
# vllm:num_requests_running per pod. A prometheus-adapter rule that does this:
#
#   rules:
#     - seriesQuery: 'vllm:num_requests_running{namespace!="",pod!=""}'
#       resources:
#         overrides:
#           namespace: {resource: namespace}
#           pod: {resource: pod}
#       name:
#         as: vllm_num_requests_running
#       metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
#
# Metric choice:
#   - num_requests_running is occupancy. It stays up while requests are still executing,
#     which holds replicas through a burst. It cannot exceed --max-num-seqs, so it says
#     nothing about queue depth once pods are full: alert on num_requests_waiting separately.
#   - num_requests_waiting alone reads 0 whenever the queue is empty, including right after
#     new pods drained it, so a waiting-only autoscaler scales down, refills the queue and
#     oscillates.
#
# Target: about 0.6 x --max-num-seqs (16 here). The target must stay below --max-num-seqs,
# or it can never be reached and the model never scales up. Move it whenever max-num-seqs
# changes. With a high floor, load spreads thin; check the measured per-pod occupancy at the
# queue depths you care about and lower the target if the queue grows before the target is
# reached.
#
# Floors and ceilings: set minReplicas from how much queueing you accept with the slowest
# cold start you have (a new pod is no help for a burst shorter than its start time), and
# maxReplicas as the brake on overshoot.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm-qwen3-8b
  namespace: llm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-qwen3-8b
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Pods
      pods:
        metric:
          name: vllm_num_requests_running
        target:
          type: AverageValue
          averageValue: "10"
  behavior:
    scaleUp:
      # React at once; a new pod still needs its whole cold start before it helps.
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
        - type: Percent
          value: 50
          periodSeconds: 120
    scaleDown:
      # HPA scales down to the highest recommendation in this window, so a long window
      # protects against cutting on a short dip. Replacing a pod costs a full cold start.
      stabilizationWindowSeconds: 1200
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
